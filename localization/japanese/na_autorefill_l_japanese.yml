l_japanese:
 na_autorefill_label:0 "毎月の補充"
 na_autorefill_tooltip:0 "#T 毎月の補充#!\n有効にすると、自身の常備軍が毎月、最大兵力の10%を上限として補充されます。最初の補充は有効化から1か月後に行われます。実際に補充された兵士の分だけ、通常の遊牧民の補充費用を支払います。選択した資源が不足している場合、補充される兵士は少なくなります。\n\n招集済みの連隊は、自分の領国または同盟者が支配する陸上で停止しており、戦闘・襲撃・物々交換を行っていない必要があります。複数の軍に分かれた連隊は、一部でも条件を満たさなければ、連隊全体の補充が保留されます。\n\n無効にすると、自動補充とそれに伴う支払いが停止します。手動での補充は引き続き利用できます。新しい統治者は、この設定が無効の状態で開始します。"
 na_payment_label:0 "支払い："
 na_payment_herd:0 "[herd_i] 遊牧群"
 na_payment_gold:0 "[gold_i] 金"
 na_payment_herd_tooltip:0 "#T 遊牧群で補充#!\n遊牧群を消費して兵士を補充します。費用は遊牧民の通常の補充価格に基づき、軍事能力と難易度による補正が適用されます。選択した支払い資源が自動的に別の資源へ切り替わることはありません。"
 na_payment_gold_tooltip:0 "#T 金で補充#!\n金を消費して兵士を補充します。費用は遊牧民の通常の補充価格に基づき、軍事能力・パーク・難易度による補正が適用されます。選択した支払い資源が自動的に別の資源へ切り替わることはありません。"
