l_korean:
 na_autorefill_label:0 "매달 충원"
 na_autorefill_tooltip:0 "#T 매달 충원#!\n활성화하면 자신의 무장병이 매달 최대 병력의 10%에 해당하는 병사 수를 한도로 충원됩니다. 첫 충원은 활성화한 뒤 한 달 후에 이루어집니다. 실제로 충원된 병사에 대해서만 일반적인 유목민 충원 비용을 지불합니다. 선택한 자원이 부족하면 충원되는 병사 수가 줄어듭니다.\n\n소집된 연대는 자신의 봉역이나 동맹이 지배하는 육지에 정지해 있어야 하며, 전투·약탈·물물 교환 중이어서는 안 됩니다. 여러 군대로 나뉜 연대는 어느 한 부분이라도 조건을 충족하지 못하면 연대 전체의 충원이 보류됩니다.\n\n비활성화하면 자동 충원과 그에 따른 지출이 중단됩니다. 수동 충원은 계속 이용할 수 있습니다. 새로운 통치자는 이 설정이 꺼진 상태로 시작합니다."
 na_payment_label:0 "지불 수단:"
 na_payment_herd:0 "[herd_i] 유목 집단"
 na_payment_gold:0 "[gold_i] 금화"
 na_payment_herd_tooltip:0 "#T 유목 집단으로 충원#!\n유목 집단을 소모하여 병사를 충원합니다. 비용은 일반적인 유목민 충원 비용을 기준으로 하며, 전투 능력과 난이도 보정이 적용됩니다. 선택한 지불 자원은 다른 자원으로 자동 전환되지 않습니다."
 na_payment_gold_tooltip:0 "#T 금화로 충원#!\n금화를 소모하여 병사를 충원합니다. 비용은 일반적인 유목민 충원 비용을 기준으로 하며, 전투 능력, 성취, 난이도 보정이 적용됩니다. 선택한 지불 자원은 다른 자원으로 자동 전환되지 않습니다."
