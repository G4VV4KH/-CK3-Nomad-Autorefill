l_russian:
 na_autorefill_label:0 "Ежемесячное пополнение"
 na_autorefill_tooltip:0 "#T Ежемесячное пополнение#!\nПока эта настройка включена, личные полки профессионалов восстанавливают до 10% максимальной численности в месяц. Первое пополнение происходит через месяц после включения. Оплачиваются только восстановленные солдаты по обычной цене пополнения для кочевников. Если выбранного ресурса не хватает, возвращается меньше солдат.\n\nСобранные полки должны стоять на суше под контролем вашей державы или союзника, вне боя, набега и торговли. Если полк разделён между армиями, все его части должны соответствовать этим условиям.\n\nОтключение прекращает автоматическое пополнение и расходы на него. Ручное пополнение остаётся доступным. У нового правителя эта настройка изначально выключена."
 na_payment_label:0 "Оплата:"
 na_payment_herd:0 "[herd_i] Стадо"
 na_payment_gold:0 "[gold_i] Золото"
 na_payment_herd_tooltip:0 "#T Пополнять за стадо#!\nТратить стадо на восстановление солдат по обычной цене пополнения для кочевников с учётом военного дела и сложности игры. Выбранный ресурс оплаты не заменяется другим автоматически."
 na_payment_gold_tooltip:0 "#T Пополнять за золото#!\nТратить золото на восстановление солдат по обычной цене пополнения для кочевников с учётом военного дела, навыков и сложности игры. Выбранный ресурс оплаты не заменяется другим автоматически."
