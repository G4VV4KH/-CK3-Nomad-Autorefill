l_simp_chinese:
 na_autorefill_label:0 "每月补员"
 na_autorefill_tooltip:0 "#T 每月补员#!\n启用后，你个人的兵士每月最多补充相当于最大兵力10%的士兵。首次补员在启用一个月后进行。仅按游牧统治者的通常补员价格，为实际补充的士兵付费。如果所选资源不足，补充的士兵数量就会减少。\n\n已集结的军团必须停驻在你的领地或盟友所控制的陆地上，且未在战斗、劫掠或易物交易中。如果一个军团分属多支军队，只要任何一部分不符合条件，整个军团就会暂停补员。\n\n关闭此选项会停止自动补员及其费用支出。手动补员仍然可用。新统治者的此选项默认为关闭。"
 na_payment_label:0 "支付方式："
 na_payment_herd:0 "[herd_i] 牧群"
 na_payment_gold:0 "[gold_i] 金钱"
 na_payment_herd_tooltip:0 "#T 使用牧群补员#!\n消耗牧群来补充士兵，按游牧统治者的通常补员价格计算，并应用军事能力和难度修正。所选支付资源绝不会自动切换为其他资源。"
 na_payment_gold_tooltip:0 "#T 使用金钱补员#!\n消耗金钱来补充士兵，按游牧统治者的通常补员价格计算，并应用军事能力、技能和难度修正。所选支付资源绝不会自动切换为其他资源。"
